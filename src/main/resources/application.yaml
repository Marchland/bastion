bastion:
  timezone: ${BASTION_TIMEZONE}
  public-url: ${BASTION_PUBLIC_URL}
  content:
    base-url: ${BASTION_CONTENT_BASE_URL}
    path-pattern: ${BASTION_PATH_PATTERN}
  media:
    base-url: ${BASTION_MEDIA_BASE_URL}
    s3:
      access-key-id: ${BASTION_MEDIA_S3_ACCESS_KEY_ID}
      secret-access-key: ${BASTION_MEDIA_S3_SECRET_ACCESS_KEY}
      endpoint: ${BASTION_MEDIA_S3_ENDPOINT}
      region: ${BASTION_MEDIA_S3_REGION}
      bucket: ${BASTION_MEDIA_S3_BUCKET}
  indieauth:
    me: ${BASTION_INDIEAUTH_ME}
    herald:
      base-url: ${BASTION_INDIEAUTH_HERALD_BASE_URL:}
      authorize-path: ${BASTION_INDIEAUTH_HERALD_AUTHORIZE_PATH:/auth}
    purge-interval: ${BASTION_INDIEAUTH_PURGE_INTERVAL:1h}
    code-retention: ${BASTION_INDIEAUTH_CODE_RETENTION:1d}
    refresh-token-ttl: ${BASTION_INDIEAUTH_REFRESH_TOKEN_TTL:90d}
    profile:
      name: ${BASTION_INDIEAUTH_PROFILE_NAME:}
      url: ${BASTION_INDIEAUTH_PROFILE_URL:}
      photo: ${BASTION_INDIEAUTH_PROFILE_PHOTO:}
      email: ${BASTION_INDIEAUTH_PROFILE_EMAIL:}
    github:
      client-id: ${BASTION_INDIEAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${BASTION_INDIEAUTH_GITHUB_CLIENT_SECRET:}
      redirect-uri: ${BASTION_INDIEAUTH_GITHUB_REDIRECT_URI:}
      authorize-url: ${BASTION_INDIEAUTH_GITHUB_AUTHORIZE_URL:https://github.com/login/oauth/authorize}
  webmention:
    rate-limit:
      source-limit: ${BASTION_WEBMENTION_RATE_LIMIT_SOURCE_LIMIT:10}
      source-window: ${BASTION_WEBMENTION_RATE_LIMIT_SOURCE_WINDOW:1h}
      pair-limit: ${BASTION_WEBMENTION_RATE_LIMIT_PAIR_LIMIT:1}
      pair-cooldown: ${BASTION_WEBMENTION_RATE_LIMIT_PAIR_COOLDOWN:30s}
      key-prefix: ${BASTION_WEBMENTION_RATE_LIMIT_KEY_PREFIX:bastion:webmention:rate-limit}
      keep-after-refill: ${BASTION_WEBMENTION_RATE_LIMIT_KEEP_AFTER_REFILL:5m}
      redis:
        uri: ${BASTION_REDIS_URI:redis://localhost:6379}
        database: ${BASTION_REDIS_DATABASE:0}
        username: ${BASTION_REDIS_USERNAME:}
        password: ${BASTION_REDIS_PASSWORD:}
        ssl: ${BASTION_REDIS_SSL:false}
        timeout: ${BASTION_REDIS_TIMEOUT:2s}
    retry-interval-minutes: ${BASTION_WEBMENTION_RETRY_INTERVAL_MINUTES:30}
    max-attempts: ${BASTION_WEBMENTION_MAX_ATTEMPTS:5}
    backoff-base-seconds: ${BASTION_WEBMENTION_BACKOFF_BASE_SECONDS:1800}
    backoff-max-seconds: ${BASTION_WEBMENTION_BACKOFF_MAX_SECONDS:86400}
    connect-timeout-seconds: ${BASTION_WEBMENTION_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${BASTION_WEBMENTION_READ_TIMEOUT_SECONDS:10}
  websub:
    hubs: ${BASTION_WEBSUB_HUBS:}
    topic-url: ${BASTION_WEBSUB_TOPIC_URL:}
    connect-timeout-seconds: ${BASTION_WEBSUB_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${BASTION_WEBSUB_READ_TIMEOUT_SECONDS:10}
  cors:
    allowed-origins: ${BASTION_CORS_ALLOWED_ORIGINS:}
    allowed-methods: ${BASTION_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${BASTION_CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${BASTION_CORS_EXPOSED_HEADERS:}
    allow-credentials: ${BASTION_CORS_ALLOW_CREDENTIALS:false}
    max-age: ${BASTION_CORS_MAX_AGE:3600}
  micropub:
    syndication:
      targets: [ ]

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:info}

spring:
  config:
    import: optional:file:/etc/config/micropub.yml,file:${BASTION_POST_TYPES_CONFIG_FILE:/etc/config/post-types.yaml},file:${BASTION_PROPERTIES_CONFIG_FILE:/etc/config/properties.yaml}
  application:
    name: bastion
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://${SPRING_PG_HOST}:${SPRING_PG_PORT:5432}/${SPRING_PG_DB}
    username: ${SPRING_PG_USERNAME}
    password: ${SPRING_PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  modulith:
    events:
      completion-mode: ${BASTION_EVENT_COMPLETION_MODE:delete}
      republish-outstanding-events-on-restart: ${BASTION_EVENT_REPUBLISH_ON_RESTART:false}
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      jdbc:
        schema-initialization:
          enabled: true
      staleness:
        check-interval: ${BASTION_EVENT_STALENESS_CHECK_INTERVAL:1m}
        published: ${BASTION_EVENT_STALENESS_PUBLISHED:5m}
        processing: ${BASTION_EVENT_STALENESS_PROCESSING:5m}
        resubmitted: ${BASTION_EVENT_STALENESS_RESUBMITTED:5m}
  task:
    execution:
      pool:
        core-size: ${BASTION_EVENT_EXECUTOR_CORE_SIZE:2}
        max-size: ${BASTION_EVENT_EXECUTOR_MAX_SIZE:4}
        queue-capacity: ${BASTION_EVENT_EXECUTOR_QUEUE_CAPACITY:500}
      thread-name-prefix: bastion-events-

jobrunr:
  background-job-server:
    enabled: ${JOBRUNR_BACKGROUND_JOB_SERVER:true}
    worker-count: ${JOBRUNR_WORKER_COUNT:4}
    poll-interval-in-seconds: ${JOBRUNR_POLL_INTERVAL_SECONDS:15}
  dashboard:
    enabled: ${JOBRUNR_DASHBOARD_ENABLE:true}
  database:
    type: sql
