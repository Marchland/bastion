bastion:
  timezone: ${BASTION_TIMEZONE:Asia/Manila}
  public-url: ${BASTION_PUBLIC_URL:https://bastion.test}
  content:
    base-url: ${BASTION_CONTENT_BASE_URL:https://bastion.test}
    path-pattern: "{year}/{month}/{day}/{slug}"
  media:
    base-url: ${BASTION_MEDIA_BASE_URL:https://media.bastion.test}
    s3:
      access-key-id: ${BASTION_MEDIA_S3_ACCESS_KEY_ID:test-access-key}
      secret-access-key: ${BASTION_MEDIA_S3_SECRET_ACCESS_KEY:test-secret-key}
      endpoint: ${BASTION_MEDIA_S3_ENDPOINT:https://s3.bastion.test}
      region: ${BASTION_MEDIA_S3_REGION:us-east-1}
      bucket: ${BASTION_MEDIA_S3_BUCKET:bastion-test}
  cors:
    allowed-origins: ${BASTION_CORS_ALLOWED_ORIGINS:https://bastion.test}
    allowed-methods: ${BASTION_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${BASTION_CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${BASTION_CORS_EXPOSED_HEADERS:}
    allow-credentials: ${BASTION_CORS_ALLOW_CREDENTIALS:false}
    max-age: ${BASTION_CORS_MAX_AGE:3600}
  indieauth:
    me: ${BASTION_INDIEAUTH_ME:https://bastion.test}
    herald:
      base-url: ${BASTION_INDIEAUTH_HERALD_BASE_URL:https://herald.test}
      authorize-path: ${BASTION_INDIEAUTH_HERALD_AUTHORIZE_PATH:/auth}
    github:
      client-id: ${BASTION_INDIEAUTH_GITHUB_CLIENT_ID:test-client-id}
      client-secret: ${BASTION_INDIEAUTH_GITHUB_CLIENT_SECRET:test-client-secret}

logging:
  level:
    root: info

spring:
  config:
    import: classpath:post-types.yaml,classpath:properties.yaml
  application:
    name: bastion
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-version: 0
    baseline-on-migrate: true

jobrunr:
  background-job-server:
    enabled: ${JOBRUNR_BACKGROUND_JOB_SERVER:false}
  dashboard:
    enabled: ${JOBRUNR_DASHBOARD_ENABLE:false}
  database:
    type: sql
