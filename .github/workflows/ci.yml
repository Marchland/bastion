name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: read

env:
  PACKAGES_USER: jacobsandersen
  PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
  BASTION_TIMEZONE: Asia/Manila
  BASTION_PUBLIC_URL: https://bastion.test
  BASTION_CONTENT_BASE_URL: https://bastion.test
  BASTION_PATH_PATTERN: "{year}/{month}/{day}/{slug}"
  BASTION_MEDIA_BASE_URL: https://media.bastion.test
  BASTION_MEDIA_S3_ACCESS_KEY_ID: test-access-key
  BASTION_MEDIA_S3_SECRET_ACCESS_KEY: test-secret-key
  BASTION_MEDIA_S3_ENDPOINT: https://s3.bastion.test
  BASTION_MEDIA_S3_REGION: us-east-1
  BASTION_MEDIA_S3_BUCKET: bastion-test
  BASTION_INDIEAUTH_ME: https://bastion.test
  BASTION_INDIEAUTH_HERALD_BASE_URL: https://herald.test
  BASTION_INDIEAUTH_GITHUB_CLIENT_ID: test-client-id
  BASTION_INDIEAUTH_GITHUB_CLIENT_SECRET: test-client-secret
  SPRING_PG_HOST: localhost
  SPRING_PG_PORT: "5432"
  SPRING_PG_DB: bastion
  SPRING_PG_USERNAME: postgres
  SPRING_PG_PASSWORD: postgres

jobs:
  integration:
    name: Full integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Run full test suite
        run: ./gradlew test
