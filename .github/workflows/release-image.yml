name: Release image

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: false
        default: main
      image_tag:
        description: Image tag to publish
        required: true

permissions:
  contents: read
  packages: write

env:
  PACKAGES_USER: jacobsandersen
  PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
  BASTION_TIMEZONE: Asia/Manila
  BASTION_PUBLIC_URL: https://bastion.test
  BASTION_CONTENT_BASE_URL: https://bastion.test
  BASTION_PATH_PATTERN: "{year}/{month}/{day}/{slug}"
  BASTION_MEDIA_BASE_URL: https://media.bastion.test
  BASTION_MEDIA_S3_ACCESS_KEY_ID: test-access-key
  BASTION_MEDIA_S3_SECRET_ACCESS_KEY: test-secret-key
  BASTION_MEDIA_S3_ENDPOINT: https://s3.bastion.test
  BASTION_MEDIA_S3_REGION: us-east-1
  BASTION_MEDIA_S3_BUCKET: bastion-test
  BASTION_INDIEAUTH_ME: https://bastion.test
  BASTION_INDIEAUTH_HERALD_BASE_URL: https://herald.test
  BASTION_INDIEAUTH_GITHUB_CLIENT_ID: test-client-id
  BASTION_INDIEAUTH_GITHUB_CLIENT_SECRET: test-client-secret
  SPRING_PG_HOST: localhost
  SPRING_PG_PORT: "5432"
  SPRING_PG_DB: bastion
  SPRING_PG_USERNAME: postgres
  SPRING_PG_PASSWORD: postgres

jobs:
  image:
    name: Verify and build distroless image
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run full integration tests
        run: ./gradlew test

      - name: Build application jar
        run: ./gradlew bootJar

      - name: Stage jar for docker
        run: cp build/libs/bastion.jar ./bastion.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bastion
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
